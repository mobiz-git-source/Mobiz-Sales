allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'

// GLOBAL JVM-17 FOR ALL SUBPROJECTS + PLUGINS
subprojects { project ->
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    afterEvaluate {
        // Fix Java
        project.tasks.withType(JavaCompile).configureEach {
            it.sourceCompatibility = JavaVersion.VERSION_17
            it.targetCompatibility = JavaVersion.VERSION_17
        }

        // Fix Kotlin
        project.plugins.withId("org.jetbrains.kotlin.android") {
            project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                it.kotlinOptions.jvmTarget = "17"
            }
        }

        // Some plugins use this property
        if (project.hasProperty("kotlinOptions")) {
            project.kotlinOptions.jvmTarget = "17"
        }

        // For Android modules
        if (project.hasProperty("android")) {
            project.android.compileOptions.sourceCompatibility = JavaVersion.VERSION_17
            project.android.compileOptions.targetCompatibility = JavaVersion.VERSION_17
        }
    }
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.google.gms:google-services:4.4.4'
        classpath 'com.android.tools.build:gradle:8.4.0'
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
